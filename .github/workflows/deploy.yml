name: Deploy to Home Server

on:
  push:
    branches:
      - main

env:
  APP_NAME: portfolio
  APP_PORT: 2001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Write env file
        run: echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
        continue-on-error: true   # repo ที่ไม่มี secret นี้ (ยังไม่ตั้ง) ก็ build ผ่านได้ ไม่มี env พิเศษ

      - name: Build Next.js
        run: npm run build

      - name: Prepare Standalone Folder
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/. .next/standalone/.next/static/
          rm -f .next/standalone/.env .env.production

      - name: Package Standalone Files
        run: tar -czf deploy.tar.gz -C .next/standalone .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Ensure remote app directory exists
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p ~/apps/${{ env.APP_NAME }}

      - name: Upload Package to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy.tar.gz"
          target: "apps/${{ env.APP_NAME }}"

      - name: Extract, Provision, and Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/apps/${{ env.APP_NAME }}
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            sudo ~/bin/deploy-app.sh ${{ env.APP_NAME }} ${{ env.APP_PORT }}